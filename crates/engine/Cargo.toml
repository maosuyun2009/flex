[package]
name = "flex-engine"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Toolkit-free glue between a Rex server and the flex UI"

[dependencies]
serde_json = "1"
tokio = { version = "1", features = ["macros", "time"] }
shrew-client = { git = "https://github.com/teddytennant/shrew", rev = "9cfc45ff91ab1d2283f7514f8a5d0096a0d68690" }
shrew-core = { workspace = true }
uuid = { version = "1", features = ["v4"] }
