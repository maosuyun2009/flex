[package]
name = "shrew-client"
version = "0.1.0"
edition = "2024"
license = "MIT"
repository = "https://github.com/teddytennant/shrew"
rust-version = "1.90"

[dependencies]
futures-util = { version = "0.3.34", default-features = false, features = ["sink", "std"] }
rustls = { version = "0.23.46", default-features = false, features = ["ring", "std", "tls12"] }
serde_json = "1.0.154"
thiserror = "2.0.21"
tokio = { version = "1.54.1", features = ["rt-multi-thread", "macros", "net", "sync", "time", "io-util"] }
tokio-tungstenite = { version = "0.30.0", features = ["rustls-tls-webpki-roots"] }
tracing = { version = "0.1.44", default-features = false }
url = "2.5.8"
shrew-proto = { version = "0.1.0", path = "../shrew-proto" }
http = "1.5.0"
serde = { version = "1.0.229", features = ["derive"] }
